<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech & Cultura</title>
    <style>
        /* Variáveis de Cores de Design System Profissional */
        :root {
            --bg-principal: #0f172a;
            --bg-card: #1e293b;
            --texto-claro: #f8fafc;
            --texto-mutado: #94a3b8;
            --cor-tech: #38bdf8;
            --cor-londres: #f43f5e;
            --cor-rio: #22c55e; /* Verde tropical para o Rio de Janeiro */
            --cor-milao: #a855f7; /* Roxo elegante para Milão */
            --borda: #334155;
        }

        /* Configurações Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Cabeçalho / Menu de Navegação */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--borda);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--cor-tech);
            margin: 0;
        }

        nav a {
            color: var(--texto-claro);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--cor-tech);
        }

        /* Container Principal do Layout */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr; /* Duas colunas: Conteúdo e Barra Lateral */
            gap: 30px;
        }

        /* Responsividade para celulares */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Artigos e Cards */
        article, .sidebar-box {
            background-color: var(--bg-card);
